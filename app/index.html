<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tai Chi Walking</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/app/style.css">
</head>
<body>
<div class="mobile-wrapper">

    <!-- Main Content Area -->
    <main class="app-content" id="app-content"></main>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav" id="bottom-nav">
        <button class="nav-item active" id="nav-home" onclick="navigate('home')">
            <span class="nav-icon">⊞</span>
            <span class="nav-label">Início</span>
        </button>
        <button class="nav-item" id="nav-days" onclick="navigate('days')">
            <span class="nav-icon">▶</span>
            <span class="nav-label">Jornada</span>
        </button>
        <button class="nav-item" id="nav-extras" onclick="navigate('extras')">
            <span class="nav-icon">✦</span>
            <span class="nav-label">Bônus</span>
        </button>
        <button class="nav-item" id="nav-progress" onclick="navigate('progress')">
            <span class="nav-icon">◎</span>
            <span class="nav-label">Progresso</span>
        </button>
    </nav>

    <!-- ═══════════════ TEMPLATES ═══════════════ -->

    <!-- HOME -->
    <template id="tpl-home">
        <div class="home-view">
            <!-- Hero -->
            <div class="home-hero">
                <div class="home-hero-overlay"></div>
                <div class="home-hero-content">
                    <p class="home-greeting" id="home-greeting">Bom dia ☀️</p>
                    <h1 class="home-title">Tai Chi Walking</h1>
                    <p class="home-sub">Método de 28 dias</p>
                </div>
            </div>

            <!-- Continue Card -->
            <div class="home-body">
                <div class="continue-card" id="continue-card" onclick="goToNextDay()">
                    <div class="continue-left">
                        <span class="continue-label">CONTINUAR</span>
                        <span class="continue-day" id="continue-day-label">Dia 1</span>
                        <span class="continue-title" id="continue-day-title">O Primeiro Passo</span>
                    </div>
                    <div class="continue-arrow">▶</div>
                </div>

                <!-- Stats Strip -->
                <div class="stats-strip">
                    <div class="stat-item">
                        <span class="stat-num" id="stat-done">0</span>
                        <span class="stat-label">Concluídos</span>
                    </div>
                    <div class="stat-divider"></div>
                    <div class="stat-item">
                        <span class="stat-num" id="stat-streak">0</span>
                        <span class="stat-label">Dias</span>
                    </div>
                    <div class="stat-divider"></div>
                    <div class="stat-item">
                        <span class="stat-num" id="stat-left">28</span>
                        <span class="stat-label">Restantes</span>
                    </div>
                </div>

                <!-- Quick Access -->
                <p class="section-label">BÔNUS RÁPIDOS</p>
                <div class="quick-row">
                    <div class="quick-card" onclick="openExtra('sleep')">
                        <div class="quick-cover" style="background-image:url('/app/cover_sleep.png')"></div>
                        <span class="quick-title">Sono</span>
                    </div>
                    <div class="quick-card" onclick="openExtra('stretch')">
                        <div class="quick-cover" style="background-image:url('/app/cover_stretch.png')"></div>
                        <span class="quick-title">Alongamento</span>
                    </div>
                    <div class="quick-card" onclick="openExtra('diet')">
                        <div class="quick-cover" style="background-image:url('/app/cover_diet.png')"></div>
                        <span class="quick-title">Anti-inchaço</span>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- DAYS / JORNADA -->
    <template id="tpl-days">
        <div class="scroll-view pb-safe">
            <div class="screen-header">
                <h2 class="screen-title">Sua Jornada</h2>
            </div>
            <div id="days-container" class="weeks-list"></div>
        </div>
    </template>

    <!-- DAY DETAIL -->
    <template id="tpl-day-detail">
        <div class="detail-view pb-safe">
            <button class="floating-back" onclick="navigate('days')">‹</button>
            <div class="detail-video-wrap" id="video-wrapper"></div>
            <div class="detail-body">
                <div class="detail-tags">
                    <span class="tag-pill" id="day-badge">Dia 1</span>
                    <span class="tag-pill tag-muted" id="day-duration">10 min</span>
                </div>
                <h2 class="detail-title" id="day-title"></h2>
                <p class="detail-instructions" id="day-instructions"></p>
                <button class="btn-complete" id="btn-complete" onclick="completeDay()">
                    ✓ &nbsp; Concluí o dia
                </button>
            </div>
        </div>
    </template>

    <!-- EXTRAS -->
    <template id="tpl-extras">
        <div class="scroll-view pb-safe">
            <div class="screen-header">
                <h2 class="screen-title">Bônus</h2>
            </div>
            <div class="extras-grid">
                <div class="extra-card" onclick="openExtra('sleep')">
                    <div class="extra-cover" style="background-image:url('/app/cover_sleep.png')"></div>
                    <div class="extra-info">
                        <span class="extra-tag">Meditação</span>
                        <p class="extra-name">Sono Profundo</p>
                    </div>
                </div>
                <div class="extra-card" onclick="openExtra('stretch')">
                    <div class="extra-cover" style="background-image:url('/app/cover_stretch.png')"></div>
                    <div class="extra-info">
                        <span class="extra-tag">Alongamento</span>
                        <p class="extra-name">Revitalizante</p>
                    </div>
                </div>
                <div class="extra-card extra-wide" onclick="openExtra('diet')">
                    <div class="extra-cover" style="background-image:url('/app/cover_diet.png')"></div>
                    <div class="extra-info">
                        <span class="extra-tag">Nutrição</span>
                        <p class="extra-name">Plano Anti-inchaço 7 Dias</p>
                    </div>
                </div>
                <div class="extra-card extra-wide" onclick="openExtra('faq')">
                    <div class="extra-cover extra-cover-faq"></div>
                    <div class="extra-info">
                        <span class="extra-tag">Suporte</span>
                        <p class="extra-name">Dúvidas Frequentes</p>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- EXTRA DETAIL -->
    <template id="tpl-extra-detail">
        <div class="detail-view pb-safe">
            <button class="floating-back" onclick="navigate('extras')">‹</button>
            <div id="extra-content-wrapper"></div>
        </div>
    </template>

    <!-- PROGRESS -->
    <template id="tpl-progress">
        <div class="scroll-view pb-safe">
            <div class="screen-header">
                <h2 class="screen-title">Meu Progresso</h2>
            </div>
            <div id="progress-container" class="progress-list"></div>
            <div style="padding:0 20px 20px">
                <button class="btn-reset" onclick="resetProgress()">Reiniciar tudo</button>
            </div>
        </div>
    </template>

</div>
<script src="/app/app.js"></script>
</body>
</html>
